[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrys-cai"
version = "0.1.0"
description = "Terminal-first cybersecurity agent for authorized labs and CTFs"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.6,<0.7", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.7,<3", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
fenrys = "fenrys_cai.cli:main"
fenrys-gateway = "fenrys_cai.tui.entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fenrys_cai*"]
